x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    RRD's own API help page (intl.rrd.com/Help, indexed publicly as "RR Donnelley
    API" and stating that customer-facing APIs require a Username and APIKey
    header) refuses TCP 443 from two independent networks, api.rrd.com resolves
    to 162.27.32.131 with ports 443 and 80 filtered, and the ConnectOne customer
    storefront answers 401 on every path — the API exists but only contracted
    customers can read a byte of it.
