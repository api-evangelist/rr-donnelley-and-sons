name: RR Donnelley And Sons
description: >-
  RR Donnelley & Sons Company (RRD) is a global provider of integrated
  communications services, offering marketing, business communications,
  commercial printing, direct mail, print fulfillment, labels, logistics,
  print management, and digital communications. RRD's ConnectOne platform
  provides end-to-end marketing communications management including web-to-print
  storefronts, workflow automation, content management, and multichannel
  campaign execution. RRD serves enterprises across financial services,
  healthcare, retail, and other industries. RRD operates customer-facing APIs —
  its own help page states they authenticate with a Username and APIKey request
  header — but they are reachable only by contracted customers: the API help
  host refuses public connections, api.rrd.com has its ports filtered, and the
  ConnectOne storefront returns 401 on every path. No machine-readable contract
  is published anonymously.
